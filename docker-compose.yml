volumes:
  wandering_table:

services:
  wandering_table_db:
    image: postgres:15
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=pass
      - POSTGRES_DB=postgres
    # Порт публикуется только на localhost: без этого `./gradlew bootRun` на хосте
    # не мог подключиться к контейнеру, хотя документация утверждала обратное.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - wandering_table:/var/lib/postgresql/data

  # Локальная заглушка SMTP: письма со сбросом пароля никуда не уходят, а показываются
  # в веб-интерфейсе на http://localhost:8025. Для `bootRun` на хосте задайте в .env
  # SPRING_MAIL_HOST=localhost и SPRING_MAIL_PORT=1025.
  mailpit:
    image: axllent/mailpit
    restart: always
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

  wandering_table_app:
    build: .
    restart: always
    ports:
      - "8050:8050"
    environment:
      - JWT_SECRET_BASE64=${JWT_SECRET_BASE64}
      # Первый заведующий клуба: роли выдаёт только CLUB_MANAGER, поэтому первого
      # нужно назначить извне (см. app.bootstrap.club-manager-email).
      - CLUB_MANAGER_EMAIL=${CLUB_MANAGER_EMAIL:-}
      - APP_FIREBASE_PUSH_ENABLED=${APP_FIREBASE_PUSH_ENABLED:-false}
      - GOOGLE_APPLICATION_CREDENTIALS=/run/secrets/firebase-service-account.json
      - SPRING_DATASOURCE_URL=jdbc:postgresql://wandering_table_db:5432/postgres
      # Без SPRING_MAIL_HOST приложение поднимается, но код сброса пароля пишется в лог.
      - SPRING_MAIL_HOST=${SPRING_MAIL_HOST:-mailpit}
      - SPRING_MAIL_PORT=${SPRING_MAIL_PORT:-1025}
      - SPRING_MAIL_USERNAME=${SPRING_MAIL_USERNAME:-}
      - SPRING_MAIL_PASSWORD=${SPRING_MAIL_PASSWORD:-}
      - MAIL_FROM=${MAIL_FROM:-no-reply@wanderingtable.local}
    volumes:
      - ${FIREBASE_SECRETS_DIR:-./secrets}:/run/secrets:ro
    depends_on:
      - wandering_table_db
      - mailpit
