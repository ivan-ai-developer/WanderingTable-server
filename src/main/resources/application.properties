spring.application.name=wanderingtable
server.port=8050

spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=pass

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

jwt.secret=${JWT_SECRET_BASE64}

# Первый заведующий клуба: роли выдаёт только CLUB_MANAGER, поэтому первого нужно
# назначить извне. Укажите email уже зарегистрированного пользователя и перезапустите приложение.
app.bootstrap.club-manager-email=${CLUB_MANAGER_EMAIL:}

# Периодичность удаления просроченных refresh-токенов.
app.cleanup.refresh-tokens-interval-ms=3600000

# Лимит регистраций с одного IP. Локален для инстанса.
app.rate-limit.register.max-requests=5
app.rate-limit.register.window-seconds=60

# Отправитель письма со сбросом пароля. Сам SMTP (spring.mail.*) намеренно НЕ объявлен здесь:
# пустое, но существующее значение spring.mail.host выбрало бы SMTP-отправку без сервера.
# Хост приходит переменной окружения SPRING_MAIL_HOST (в dev — Mailpit из docker-compose).
app.mail.from=${MAIL_FROM:no-reply@wanderingtable.local}

# Время жизни кода из письма и выданного в обмен на него resetToken.
app.password-reset.code-ttl-minutes=15
app.password-reset.token-ttl-minutes=10

# Периодичность удаления просроченных строк сброса пароля.
app.cleanup.password-reset-tokens-interval-ms=3600000

# Лимит запросов сброса пароля: отдельное окно на IP и на email. Локален для инстанса.
app.rate-limit.password-reset.max-requests=10
app.rate-limit.password-reset.window-seconds=900
